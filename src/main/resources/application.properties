spring.application.name=lotto-drawing-program
server.port=8081
app.cors.allowed-origin=http://localhost:5173

spring.datasource.url=${LOTTO_DB_URL:jdbc:mysql://localhost:3306/lotto_drawing_program?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Warsaw}
spring.datasource.username=${LOTTO_DB_USER:root}
spring.datasource.password=${LOTTO_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
